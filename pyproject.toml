[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crow"
version = "0.1.0"
description = "A daily quote, pinned to the bottom line of your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Anant Chauhan", email = "anantchauhan010@gmail.com" }]

[project.urls]
Homepage = "https://github.com/Anant1711/crow"
Issues = "https://github.com/Anant1711/crow/issues"

[project.scripts]
crow = "crow.cli:main"

[tool.setuptools]
packages = ["crow", "crow.data"]

[tool.setuptools.package-data]
"crow.data" = ["quotes.json"]
